<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KorshQuake God's Eye View 3D - Centro de Monitoreo Global</title>
  
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050b14;
      --panel-bg: rgba(9, 18, 33, 0.82);
      --border: rgba(56, 189, 248, 0.2);
      --cyan: #00e5ff;
      --red: #ff1e42;
      --green: #00e676;
      --orange: #ff9100;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font-sans); color: var(--text); }
    
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    /* Top Tactical HUD */
    .hud-header {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hud-brand {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }

    .brand-logo { width: 32px; height: 32px; border-radius: 8px; }
    .brand-title { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand-title .korsh { color: #fff; }
    .brand-title .quake { color: var(--red); }
    .brand-subtitle { font-family: var(--font-mono); font-size: 0.68rem; color: var(--cyan); letter-spacing: 0.05em; }

    .hud-stats-group {
      pointer-events: auto;
      display: flex;
      gap: 8px;
    }

    .hud-stat-pill {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 7px 14px;
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
    .pulse-green { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.5s infinite; }
    .pulse-red { background: var(--red); box-shadow: 0 0 10px var(--red); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }

    /* Left Control Dock */
    .hud-dock-left {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dock-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .dock-btn:hover { background: rgba(0, 229, 255, 0.15); border-color: var(--cyan); color: var(--cyan); transform: scale(1.05); }
    .dock-btn.active { background: rgba(0, 229, 255, 0.25); border-color: var(--cyan); color: var(--cyan); }

    /* Bottom Control Bar */
    .hud-bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      padding: 8px 14px;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    }

    .camera-preset-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .camera-preset-btn:hover { background: rgba(0, 229, 255, 0.12); color: #fff; border-color: var(--cyan); }
    .camera-preset-btn.active { background: rgba(0, 229, 255, 0.2); color: var(--cyan); border-color: var(--cyan); }

    .switch-view-btn {
      background: linear-gradient(135deg, rgba(255, 30, 66, 0.2), rgba(255, 23, 68, 0.4));
      border: 1px solid var(--red);
      color: #fff;
      font-weight: 700;
      padding: 7px 15px;
      border-radius: 8px;
      font-size: 0.8rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .switch-view-btn:hover { background: var(--red); transform: translateY(-1px); box-shadow: 0 0 15px rgba(255, 30, 66, 0.5); }

    /* Tactical Quake Hover Card */
    .tactical-hover-card {
      position: absolute;
      z-index: 20;
      pointer-events: none;
      background: rgba(5, 15, 28, 0.94);
      border: 1px solid var(--cyan);
      backdrop-filter: blur(14px);
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 8px 30px rgba(0, 229, 255, 0.25);
      max-width: 320px;
      display: none;
      transition: opacity 0.15s ease;
    }

    .thc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .thc-mag { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 800; color: var(--red); }
    .thc-tag { font-family: var(--font-mono); font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background: rgba(0,229,255,0.15); color: var(--cyan); border: 1px solid rgba(0,229,255,0.3); }
    .thc-place { font-size: 0.9rem; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
    .thc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px; }
    .thc-grid strong { color: var(--text); }

    /* Loading Overlay */
    .globe-loader {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: #050b14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.5s ease;
    }
    .loader-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 229, 255, 0.15);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-family: var(--font-mono); font-size: 0.85rem; color: var(--cyan); letter-spacing: 0.08em; }

    @media (max-width: 768px) {
      .hud-header { flex-direction: column; align-items: stretch; gap: 8px; }
      .hud-stats-group { justify-content: space-between; }
      .hud-dock-left { display: none; }
      .hud-bottom-bar { width: 94%; flex-wrap: wrap; justify-content: center; bottom: 12px; }
      .camera-preset-btn { padding: 6px 10px; font-size: 0.72rem; }
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div class="globe-loader" id="globe-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">INICIALIZANDO GLOBO TÁCTICO 3D...</div>
  </div>

  <!-- Three.js Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Header HUD -->
  <header class="hud-header">
    <div class="hud-brand">
      <img src="/icons/logo.png" alt="Logo" class="brand-logo" onerror="this.src='/icons/icon-192.png'">
      <div>
        <div class="brand-title"><span class="korsh">Korsh</span><span class="quake">Quake</span> God's Eye View</div>
        <div class="brand-subtitle">GLOBAL TECTONIC SPHERE 3D • ak135 ENGINE</div>
      </div>
    </div>

    <div class="hud-stats-group">
      <div class="hud-stat-pill">
        <span class="stat-dot pulse-green"></span>
        <span id="stat-cluster">7 Redes Online</span>
      </div>
      <div class="hud-stat-pill">
        <span class="stat-dot pulse-red"></span>
        <span>Sismos: <strong id="stat-count" style="color: var(--cyan);">0</strong></span>
      </div>
      <div class="hud-stat-pill">
        <span>Max: <strong id="stat-max-mag" style="color: var(--red);">--</strong></span>
      </div>
    </div>
  </header>

  <!-- Left Tactical Dock -->
  <div class="hud-dock-left">
    <button class="dock-btn active" id="btn-toggle-plates" title="Alternar Placas Tectónicas (Fallas Activas)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
    </button>
    <button class="dock-btn active" id="btn-toggle-spin" title="Rotación Automática">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    </button>
    <button class="dock-btn" id="btn-reset-cam" title="Reiniciar Cámara">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
    </button>
    <button class="dock-btn" id="btn-toggle-fullscreen" title="Pantalla Completa">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    </button>
  </div>

  <!-- Bottom Navigation & Camera Presets -->
  <div class="hud-bottom-bar">
    <button class="camera-preset-btn active" data-lat="15" data-lon="-40" data-dist="260">Vista General</button>
    <button class="camera-preset-btn" data-lat="9" data-lon="-72" data-dist="160">América Latina</button>
    <button class="camera-preset-btn" data-lat="38" data-lon="-4" data-dist="150">España & Europa</button>
    <button class="camera-preset-btn" data-lat="-34" data-lon="-64" data-dist="160">Cono Sur</button>
    <button class="camera-preset-btn" data-lat="15" data-lon="-105" data-dist="220">Cinturón de Fuego</button>

    <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.15); margin: 0 4px;"></div>
    
    <a href="/" class="switch-view-btn" title="Volver a la vista 2D del monitor">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      <span>Centro de Control 2D</span>
    </a>
  </div>

  <!-- Tactical Hover Card -->
  <div class="tactical-hover-card" id="hover-card">
    <div class="thc-header">
      <span class="thc-mag font-mono" id="card-mag">M 5.8</span>
      <span class="thc-tag" id="card-country">PA / VE / ES / AR</span>
    </div>
    <div class="thc-place" id="card-place">Caracas, Venezuela</div>
    <div class="thc-grid">
      <div>Prof: <strong id="card-depth">12 km</strong></div>
      <div>MMI: <strong id="card-mmi">VI Fuerte</strong></div>
      <div>Ocurrencia: <strong id="card-time">hace 4m</strong></div>
      <div>Validación: <strong id="card-source" style="color: var(--green);">Consenso</strong></div>
    </div>
  </div>

  <!-- Local Three.js and OrbitControls -->
  <script src="/vendor/three/three.min.js"></script>
  <script src="/vendor/three/OrbitControls.js"></script>

  <script>
    // =========================================================================
    // KORSHQUAKE GOD'S EYE 3D TACTICAL SPHERE ENGINE
    // =========================================================================
    const GLOBE_RADIUS = 100;
    let scene, camera, renderer, controls;
    let globeMesh, atmosphereMesh, platesGroup, worldGroup, quakesGroup;
    let autoRotate = true;
    let showPlates = true;
    let allQuakesData = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredMesh = null;

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scene & Camera
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050b14);
      scene.fog = new THREE.FogExp2(0x050b14, 0.0016);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
      camera.position.set(0, 40, 260);

      // 2. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // 3. OrbitControls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.rotateSpeed = 0.6;
      controls.zoomSpeed = 0.8;
      controls.minDistance = 120;
      controls.maxDistance = 550;
      controls.autoRotate = autoRotate;
      controls.autoRotateSpeed = 0.5;

      // 4. Lights
      const ambientLight = new THREE.AmbientLight(0xdcf8ff, 0.65);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(200, 150, 200);
      scene.add(dirLight);

      const blueBackLight = new THREE.DirectionalLight(0x00e5ff, 0.6);
      blueBackLight.position.set(-200, -100, -200);
      scene.add(blueBackLight);

      // 5. Starfield Particles
      createStarfield();

      // 6. Tactical Earth Sphere
      createEarthSphere();

      // 7. Groups
      worldGroup = new THREE.Group();
      platesGroup = new THREE.Group();
      quakesGroup = new THREE.Group();
      scene.add(worldGroup);
      scene.add(platesGroup);
      scene.add(quakesGroup);

      // 8. Load Vector Boundaries & Real Quakes
      loadWorldGeoJSON();
      loadPlatesGeoJSON();
      fetchQuakes3D();
      setInterval(fetchQuakes3D, 5000);

      // 9. Event Listeners
      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('pointermove', onPointerMove);
      renderer.domElement.addEventListener('pointerdown', () => { autoRotate = false; controls.autoRotate = false; });

      setupUI();

      // Animate
      animate();
    }

    // Mathematical coordinate mapping to 3D Sphere (WGS84 -> Cartesian)
    function latLonToVector3(lat, lon, radius, alt = 0) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      const r = radius + alt;
      const x = -(r * Math.sin(phi) * Math.cos(theta));
      const z = (r * Math.sin(phi) * Math.sin(theta));
      const y = (r * Math.cos(phi));
      return new THREE.Vector3(x, y, z);
    }

    function createEarthSphere() {
      // Base Globe
      const sphereGeo = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);
      const sphereMat = new THREE.MeshPhongMaterial({
        color: 0x071526,
        emissive: 0x020813,
        specular: 0x00e5ff,
        shininess: 14,
        wireframe: false
      });
      globeMesh = new THREE.Mesh(sphereGeo, sphereMat);
      scene.add(globeMesh);

      // Subtle Tactical Grid Lat/Lon Lines
      const gridMat = new THREE.LineBasicMaterial({ color: 0x0e2744, transparent: true, opacity: 0.35 });
      for (let lat = -80; lat <= 80; lat += 20) {
        const pts = [];
        for (let lon = -180; lon <= 180; lon += 5) {
          pts.push(latLonToVector3(lat, lon, GLOBE_RADIUS + 0.1));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        scene.add(new THREE.Line(geo, gridMat));
      }
      for (let lon = -180; lon < 180; lon += 30) {
        const pts = [];
        for (let lat = -85; lat <= 85; lat += 5) {
          pts.push(latLonToVector3(lat, lon, GLOBE_RADIUS + 0.1));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        scene.add(new THREE.Line(geo, gridMat));
      }

      // Outer Glow Atmosphere Shell
      const atmosGeo = new THREE.SphereGeometry(GLOBE_RADIUS * 1.035, 48, 48);
      const atmosMat = new THREE.MeshBasicMaterial({
        color: 0x00e5ff,
        transparent: true,
        opacity: 0.08,
        side: THREE.BackSide
      });
      atmosphereMesh = new THREE.Mesh(atmosGeo, atmosMat);
      scene.add(atmosphereMesh);
    }

    function createStarfield() {
      const starGeo = new THREE.BufferGeometry();
      const count = 1800;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        const r = 600 + Math.random() * 500;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        positions[i] = r * Math.sin(phi) * Math.cos(theta);
        positions[i+1] = r * Math.cos(phi);
        positions[i+2] = r * Math.sin(phi) * Math.sin(theta);
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const starMat = new THREE.PointsMaterial({ color: 0x64748b, size: 1.8, transparent: true, opacity: 0.65 });
      scene.add(new THREE.Points(starGeo, starMat));
    }

    // Load World GeoJSON Continents
    async function loadWorldGeoJSON() {
      try {
        const res = await fetch('/vendor/world.json');
        if (!res.ok) return;
        const data = await res.json();
        const mat = new THREE.LineBasicMaterial({ color: 0x1e4976, transparent: true, opacity: 0.75 });

        data.features.forEach(f => {
          if (!f.geometry) return;
          const coords = f.geometry.coordinates;
          const type = f.geometry.type;

          const renderLine = (ring) => {
            const pts = [];
            ring.forEach(pt => {
              pts.push(latLonToVector3(pt[1], pt[0], GLOBE_RADIUS + 0.2));
            });
            if (pts.length > 1) {
              const geo = new THREE.BufferGeometry().setFromPoints(pts);
              worldGroup.add(new THREE.Line(geo, mat));
            }
          };

          if (type === 'Polygon') coords.forEach(renderLine);
          else if (type === 'MultiPolygon') coords.forEach(poly => poly.forEach(renderLine));
        });
      } catch (err) {
        console.warn('World GeoJSON fallback:', err);
      }
    }

    // Load Tectonic Plates Neon Red Lines
    async function loadPlatesGeoJSON() {
      try {
        const res = await fetch('/vendor/plates.json');
        if (!res.ok) return;
        const data = await res.json();
        const mat = new THREE.LineBasicMaterial({ color: 0xff1e42, transparent: true, opacity: 0.85, linewidth: 2 });

        data.features.forEach(f => {
          if (!f.geometry || !f.geometry.coordinates) return;
          const coords = f.geometry.coordinates;
          const pts = [];
          coords.forEach(pt => {
            pts.push(latLonToVector3(pt[1], pt[0], GLOBE_RADIUS + 0.35));
          });
          if (pts.length > 1) {
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            platesGroup.add(new THREE.Line(geo, mat));
          }
        });
      } catch (err) {
        console.warn('Plates GeoJSON fallback:', err);
      }
    }

    // Fetch and Plot Real-Time Earthquakes
    async function fetchQuakes3D() {
      try {
        const res = await fetch('/api/quakes');
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.features) {
          allQuakesData = data.features;
          renderQuakes3D(allQuakesData);

          const countEl = document.getElementById('stat-count');
          const maxEl = document.getElementById('stat-max-mag');
          if (countEl) countEl.textContent = allQuakesData.length;
          
          let maxMag = 0;
          allQuakesData.forEach(q => {
            if (q.properties && q.properties.mag > maxMag) maxMag = q.properties.mag;
          });
          if (maxEl) maxEl.textContent = maxMag ? `M ${maxMag.toFixed(1)}` : '--';

          const loader = document.getElementById('globe-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
          }
        }
      } catch (err) {
        console.error('Error fetching 3D quakes:', err);
      }
    }

    function renderQuakes3D(features) {
      // Clear previous quakes
      while (quakesGroup.children.length > 0) {
        const obj = quakesGroup.children[0];
        quakesGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
      }

      features.forEach(f => {
        if (!f.geometry || !f.geometry.coordinates) return;
        const lon = f.geometry.coordinates[0];
        const lat = f.geometry.coordinates[1];
        const depth = f.geometry.coordinates[2] || 10;
        const mag = f.properties.mag || 3.0;

        // Position on surface
        const pos = latLonToVector3(lat, lon, GLOBE_RADIUS, 0.4);

        // Color by magnitude
        let hexColor = 0x38bdf8;
        if (mag >= 6.0) hexColor = 0xff1744;
        else if (mag >= 4.5) hexColor = 0xff6d00;
        else if (mag >= 3.0) hexColor = 0xffd600;

        // Quake Epicenter Sphere
        const radius = Math.max(0.7, (mag - 2.0) * 0.7);
        const geo = new THREE.SphereGeometry(radius, 16, 16);
        const mat = new THREE.MeshPhongMaterial({
          color: hexColor,
          emissive: hexColor,
          emissiveIntensity: 0.6,
          shininess: 30
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        mesh.userData = f;
        quakesGroup.add(mesh);

        // Depth Skewer into Earth Core
        const depthAlt = -Math.min(25, depth * 0.15);
        const innerPos = latLonToVector3(lat, lon, GLOBE_RADIUS + depthAlt);
        const lineGeo = new THREE.BufferGeometry().setFromPoints([pos, innerPos]);
        const lineMat = new THREE.LineBasicMaterial({ color: hexColor, transparent: true, opacity: 0.6 });
        quakesGroup.add(new THREE.Line(lineGeo, lineMat));

        // Pulsing Sonar Ring on Surface
        const ringGeo = new THREE.RingGeometry(radius * 1.2, radius * 1.8, 24);
        const ringMat = new THREE.MeshBasicMaterial({ color: hexColor, side: THREE.DoubleSide, transparent: true, opacity: 0.75 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.position.copy(pos);
        ringMesh.lookAt(new THREE.Vector3(0, 0, 0));
        quakesGroup.add(ringMesh);
      });
    }

    // Raycasting Hover Interactivity
    function onPointerMove(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(quakesGroup.children.filter(c => c.isMesh && c.userData && c.userData.properties));

      const card = document.getElementById('hover-card');
      if (intersects.length > 0) {
        const top = intersects[0].object;
        const q = top.userData;
        const p = q.properties;
        const coords = q.geometry.coordinates;

        document.getElementById('card-mag').textContent = `M ${(p.mag || 0).toFixed(1)}`;
        document.getElementById('card-mag').style.color = p.mag >= 6.0 ? '#ff1744' : (p.mag >= 4.5 ? '#ff9100' : '#00e5ff');
        document.getElementById('card-place').textContent = p.place || 'Epicentro Sísmico';
        document.getElementById('card-country').textContent = p.country_name || p.country_code || 'Internacional';
        document.getElementById('card-depth').textContent = `${Math.abs(coords[2] || 10).toFixed(0)} km`;
        document.getElementById('card-mmi').textContent = p.mmi ? `MMI ${p.mmi}` : 'Calculado';
        document.getElementById('card-source').textContent = p.source_feed || 'KorshQuake';

        const d = new Date(p.time);
        document.getElementById('card-time').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        card.style.display = 'block';
        card.style.left = Math.min(window.innerWidth - 330, e.clientX + 14) + 'px';
        card.style.top = Math.min(window.innerHeight - 170, e.clientY + 14) + 'px';
      } else {
        if (card) card.style.display = 'none';
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // UI Buttons & Presets
    function setupUI() {
      const btnPlates = document.getElementById('btn-toggle-plates');
      if (btnPlates) {
        btnPlates.addEventListener('click', () => {
          showPlates = !showPlates;
          platesGroup.visible = showPlates;
          btnPlates.classList.toggle('active', showPlates);
        });
      }

      const btnSpin = document.getElementById('btn-toggle-spin');
      if (btnSpin) {
        btnSpin.addEventListener('click', () => {
          autoRotate = !autoRotate;
          controls.autoRotate = autoRotate;
          btnSpin.classList.toggle('active', autoRotate);
        });
      }

      const btnReset = document.getElementById('btn-reset-cam');
      if (btnReset) {
        btnReset.addEventListener('click', () => {
          flyCameraTo(15, -40, 260);
        });
      }

      const btnFull = document.getElementById('btn-toggle-fullscreen');
      if (btnFull) {
        btnFull.addEventListener('click', () => {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen();
          else document.exitFullscreen();
        });
      }

      // Camera Presets
      document.querySelectorAll('.camera-preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.camera-preset-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const lat = parseFloat(btn.dataset.lat);
          const lon = parseFloat(btn.dataset.lon);
          const dist = parseFloat(btn.dataset.dist);
          flyCameraTo(lat, lon, dist);
        });
      });
    }

    function flyCameraTo(lat, lon, dist = 220) {
      const targetPos = latLonToVector3(lat, lon, dist);
      const startPos = camera.position.clone();
      const startTime = performance.now();
      const duration = 1200;

      autoRotate = false;
      controls.autoRotate = false;
      const spinBtn = document.getElementById('btn-toggle-spin');
      if (spinBtn) spinBtn.classList.remove('active');

      function step(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        camera.position.lerpVectors(startPos, targetPos, ease);
        controls.update();
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
