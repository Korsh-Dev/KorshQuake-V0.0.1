# ===== quake.korsh.online (HTTP to HTTPS Redirect) =====
server {
    listen 80;
    listen [::]:80;
    server_name quake.korsh.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== quake.korsh.online (HTTPS Produccion KorshQuake Hub) =====
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quake.korsh.online;

    ssl_certificate     /etc/letsencrypt/live/quake.korsh.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quake.korsh.online/privkey.pem;

    # Security Headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    client_max_body_size 50M;

    # Webhook instantaneo de GitHub (push trigger)
    location = /api/github-webhook {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy hacia el contenedor Docker de KorshQuake en 127.0.0.1:8088
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
