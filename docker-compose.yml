services:
  korshquake:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: korshquake-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
